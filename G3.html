<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة خَمّن الآية من الصورة</title>
    <link rel="stylesheet" href="G3.css">
</head>
<body>

    <header class="game-header">
        <a href="1st.html" class="back-btn">⬅️ العودة للرئيسية</a>
        <h2>🖼️ لعبة خَمّن الآية من الصورة</h2>
    </header>

    <main class="game-play-section">
        <div class="game-container">
            
            <!-- Sidebar Tabs -->
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchSurah('ikhlas', this)">
                    <span>🖼️</span> سورة الإخلاص
                </button>
                <button class="tab-btn" onclick="switchSurah('falaq', this)">
                    <span>🎯</span> سورة الفلق
                </button>
                <button class="tab-btn" onclick="switchSurah('nas', this)">
                    <span>🧩</span> سورة الناس
                </button>
            </div>

            <!-- Game Box -->
            <div class="game-box">
                <div class="quiz-info">
                    <span id="question-count">السؤال 1 من 5</span>
                    <span id="score-count">النقاط: 0</span>
                </div>

                <div id="quiz-body">
                    <div class="image-card">
                        <!-- مكان الصورة -->
                        <div class="img-box">
                            <img id="image-display" src="" alt="صورة الآية">
                        </div>
                        <!-- التلميح المساعد -->
                        <p id="hint-text" class="game-hint">جاري تحميل التلميح...</p>
                    </div>

                    <div id="options-container" class="options-grid"></div>
                    <div id="feedback" class="feedback"></div>
                </div>

                <!-- Result Screen -->
                <div id="result-screen" class="result-screen" style="display: none;">
                    <h2>🎉 بطل! تخمينك للآيات رائع جداً</h2>
                    <p id="final-score">درجتك: 5 / 5</p>
                    <button class="restart-btn" onclick="restartQuiz()">🔄 إعادة المحاولة</button>
                </div>
            </div>

        </div>
    </main>

    <script src="G3.js"></script>
</body>
</html>
