<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التوصيل - رحلة مع القرآن</title>
    <link rel="stylesheet" href="G4.css">
</head>
<body>
    <header class="game-header">
        <a href="1st.html" class="back-btn">⬅️ العودة للرئيسية</a>
        <h2>🔗 لعبة وصل الآية بالمعنى</h2>
    </header>

    <main class="game-play-section">
        <div class="game-container">
            <!-- Sidebar Tabs -->
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchMatchSurah('ikhlas', this)">
                    <span>🖼️</span> سورة الإخلاص
                </button>
                <button class="tab-btn" onclick="switchMatchSurah('falaq', this)">
                    <span>🎯</span> سورة الفلق
                </button>
                <button class="tab-btn" onclick="switchMatchSurah('nas', this)">
                    <span>🧩</span> سورة الناس
                </button>
            </div>

            <div class="game-box">
                <div class="quiz-info">
                    <span id="surah-title">سورة الإخلاص</span>
                    <span>النقاط: <span id="score-count">0</span></span>
                </div>
                <p class="game-hint">اضغط على الآية ثم اضغط على المعنى المناسب لها:</p>
                <div class="match-container"></div>
                <div id="feedback" class="feedback"></div>
            </div>
        </div>
    </main>

    <script src="G4.js"></script>
</body>
</html>
