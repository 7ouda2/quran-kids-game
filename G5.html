<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ترتيب السورة - رحلة مع القرآن</title>
    <link rel="stylesheet" href="G5.css">
</head>
<body>
    <header class="game-header">
        <a href="1st.html" class="back-btn">⬅️ العودة للرئيسية</a>
        <h2>🧩 لعبة تركيب ورس الآيات</h2>
    </header>

    <main class="game-play-section">
        <div class="game-container">
            <!-- Sidebar Tabs -->
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchPuzzleSurah('ikhlas', this)">
                    <span>🖼️</span> سورة الإخلاص
                </button>
                <button class="tab-btn" onclick="switchPuzzleSurah('falaq', this)">
                    <span>🎯</span> سورة الفلق
                </button>
                <button class="tab-btn" onclick="switchPuzzleSurah('nas', this)">
                    <span>🧩</span> سورة الناس
                </button>
            </div>

            <div class="game-box">
                <div class="quiz-info">
                    <span id="surah-title">سورة الإخلاص</span>
                    <span id="score-count">النقاط: 0</span>
                </div>
                <p class="game-hint">اضغط على الآيات بالترتيب الصحيح لتجميع السورة:</p>
                <div id="puzzle-board" class="puzzle-board"></div>
                <div id="result-board"></div>
                <div id="feedback" class="feedback"></div>
            </div>
        </div>
    </main>

    <script src="G5.js"></script>
</body>
</html>
