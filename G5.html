<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ترتيب السورة - رحلة مع القرآن</title>
    <link rel="stylesheet" href="G5.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>
            <h2>🧩 لعبة تركيب ورص الآيات</h2>
        </header>

        <div class="sidebar-tabs">
            <button class="tab-btn active" onclick="switchPuzzleSurah('ikhlas', this)">🖼️ سورة الإخلاص</button>
            <button class="tab-btn" onclick="switchPuzzleSurah('falaq', this)">🎯 سورة الفلق</button>
            <button class="tab-btn" onclick="switchPuzzleSurah('nas', this)">🧩 سورة الناس</button>
        </div>

        <div class="game-box">
            <div class="quiz-info">
                <span id="surah-title">سورة الإخلاص</span>
                <span id="score-count">النقاط: 0</span>
            </div>
            <p class="game-hint">اضغط على الآيات بالترتيب الصحيح لتجميع السورة:</p>
            <div id="puzzle-board" class="puzzle-board"></div>
            <div id="result-board"></div>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <script src="G5.js"></script>
</body>
</html>
